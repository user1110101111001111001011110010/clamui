[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clamui"
version = "0.2.0"
description = "Terminal frontend for ClamAV on Linux Mint"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
clamui = "clamui.__main__:main"

[tool.setuptools.packages.find]
include = ["clamui*"]
